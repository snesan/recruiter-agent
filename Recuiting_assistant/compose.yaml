name: recuiting-assistant

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_RESUME_MB: ${MAX_RESUME_MB:-10}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_OAUTH_CREDENTIALS_PATH: /app/secrets/credentials.json
      GOOGLE_OAUTH_TOKEN_PATH: /app/secrets/token.json
    volumes:
      - ./secrets:/app/secrets
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_BASE_URL: http://api:8000/api
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
